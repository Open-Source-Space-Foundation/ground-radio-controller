# One definition of the repo's checks, shared by the git hook, CI and manual
# runs (`pre-commit run --all-files`). The tools come from the Nix dev shell,
# so every hook is `language: system`; pre-commit manages no environments.
#
# A hook that changes a file fails the run.
repos:
  - repo: local
    hooks:
      # The stock file hygiene checks from pre-commit-hooks, which the dev shell provides. A fixer
      # rewrites the file and so fails the run, `types` is what the upstream definitions
      # set, which `system` hooks do not inherit.
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: system
        types: [text]

      - id: mixed-line-ending
        name: fix mixed line endings
        entry: mixed-line-ending
        language: system
        types: [text]

      - id: check-yaml
        name: check yaml
        entry: check-yaml
        language: system
        types: [yaml]

      - id: check-json
        name: check json
        entry: check-json
        language: system
        types: [json]

      - id: check-added-large-files
        name: check added large files
        entry: check-added-large-files
        language: system

      - id: check-merge-conflict
        name: check merge conflict
        entry: check-merge-conflict
        language: system
        types: [text]

      - id: check-case-conflict
        name: check case conflict
        entry: check-case-conflict
        language: system

      - id: detect-private-key
        name: detect private key
        entry: detect-private-key
        language: system
        types: [text]

      - id: check-symlinks
        name: check symlinks
        entry: check-symlinks
        language: system
        types: [symlink]

      - id: destroyed-symlinks
        name: detect destroyed symlinks
        entry: destroyed-symlinks
        language: system
        types: [file]

      # Stops a commit made directly on main. CI runs on main, where this must be skipped (SKIP).
      - id: no-commit-to-branch
        name: no commit to main
        entry: no-commit-to-branch --branch main
        language: system
        always_run: true
        pass_filenames: false

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: zizmor
        name: zizmor
        entry: zizmor --offline
        language: system
        files: ^\.github/workflows/.*\.ya?ml$

      - id: nixfmt
        name: nixfmt
        entry: nixfmt --check
        language: system
        types: [nix]

      - id: statix
        name: statix
        entry: statix check
        language: system
        types: [nix]
        pass_filenames: false

      - id: deadnix
        name: deadnix
        entry: deadnix --fail
        language: system
        types: [nix]

      - id: markdownlint
        name: markdownlint
        entry: markdownlint
        language: system
        types: [markdown]

      # Spelling in code, comments and docs. _typos.toml holds the allowed terms.
      - id: typos
        name: typos
        entry: typos --force-exclude
        language: system

      # Scans what is staged for a commit, so a secret is stopped before it reaches history.
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        always_run: true
        pass_filenames: false

      - id: clang-format
        name: clang-format
        entry: clang-format -i --Werror
        language: system
        types_or: [c, c++]

      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]

      - id: ruff-check-imports
        name: ruff check (import sorting)
        entry: ruff check --fix --select I
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
