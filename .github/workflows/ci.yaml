name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Format Check
        env:
          # Direct pushes to main are how CI runs there.
          SKIP: no-commit-to-branch
        run: |
          nix develop -c make fmt

  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # One broken board must not hide the results of the others.
      fail-fast: false
      matrix:
        include:
          - name: ground_radio_controller
            board: ground_radio_controller/rp2350a/m33
          - name: proves_flight_control_board_v5
            board: proves_flight_control_board_v5/rp2350a/m33
          - name: proves_flight_control_board_v5e
            board: proves_flight_control_board_v5e/rp2350a/m33
          - name: proves_radio_stick_v2
            board: proves_radio_stick_v2/rp2350a/m33
          - name: proves_radio_stick_v3
            board: proves_radio_stick_v3
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up workspace
        run: nix run .#setup

      - name: Generate (${{ matrix.board }})
        env:
          BOARD: ${{ matrix.board }}
        run: nix run .#generate

      - name: Build (${{ matrix.board }})
        run: nix run .#build

      - name: Archive build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-artifacts-${{ matrix.name }}
          path: build-artifacts/
