name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Format Check
        run: |
          make fmt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # - name: Install system dependencies
      #   run: |
      #     sudo apt update
      #     sudo apt install -y cmake ninja-build gperf ccache dfu-util device-tree-compiler wget python3-dev python3-venv python3-tk xz-utils file gcc gcc-multilib g++-multilib libsdl2-dev libmagic1

      - name: Initialize submodules
        run: |
          git submodule update --init --recursive

      - name: Build
        run: |
          make build
